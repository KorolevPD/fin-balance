# Переопределения для продакшен-деплоя (выполняется на сервере).
# Использование: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# В базовом docker-compose.yml наружу не публикуется ни один порт и нет
# bind-mount исходников (dev-настройки вынесены в docker-compose.override.yml).
# Здесь остаётся только публикация nginx на 80/443 и монтирование сертификатов
# Let's Encrypt — единственный наружу видимый сервис — nginx.

services:
  nginx:
    ports:
      - "${DEPLOY_PORT:-80}:80"
      - "${DEPLOY_PORT_SSL:-443}:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
