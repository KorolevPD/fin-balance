# Переопределения для продакшен-деплоя (выполняется на сервере).
# Использование: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Здесь отключаются dev-режимы (bind-mount исходников, --reload) и сервисы
# перенастраиваются под запуск через nginx на HTTP-порту 80.

services:
  backend:
    # Не монтируем исходники из хоста и не перезагружаемся — собираем образ.
    volumes: []
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    # Порт наружу не публикуем: наружу смотрит только nginx.
    expose:
      - "8000"
    ports: []

  nginx:
    ports:
      - "${DEPLOY_PORT:-80}:80"
