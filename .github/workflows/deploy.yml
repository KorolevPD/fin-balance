name: Deploy

# Деплой на арендованный сервер по SSH при пуше и merge в main.
# Все секреты читаются из GitHub Actions Secrets (см. deploy/DEPLOY.md).

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.DEPLOY_SSH_PORT }} \
            ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      # Фронтенд собирается здесь, а не на слабом сервере (1 vCPU / 1 ГБ RAM).
      # На сервер передаются готовые статики frontend/build, nginx-образ
      # собирается из них без node-стадии (nginx/Dockerfile.prod).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (SPA)
        working-directory: frontend
        env:
          REACT_APP_API_URL: /api
        run: npm run build

      - name: Remove node_modules before upload
        run: rm -rf frontend/node_modules

      - name: Copy deploy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/deploy.sh,docker-compose.yml,docker-compose.prod.yml,backend,bot,frontend,nginx"
          target: "~/fin-balance"

      - name: Run deploy on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          AI_KEY_ENCRYPTION_KEY: ${{ secrets.AI_KEY_ENCRYPTION_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: SECRET_KEY,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,AI_KEY_ENCRYPTION_KEY,GEMINI_API_KEY,BOT_TOKEN,DEPLOY_DOMAIN,CERTBOT_EMAIL
          script: |
            set -e
            bash ~/fin-balance/deploy/deploy.sh \
              "$SECRET_KEY" "$POSTGRES_USER" "$POSTGRES_PASSWORD" \
              "$POSTGRES_DB" "$AI_KEY_ENCRYPTION_KEY" "$GEMINI_API_KEY" \
              "$BOT_TOKEN" "$DEPLOY_DOMAIN" "$CERTBOT_EMAIL"
