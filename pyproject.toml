[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [
    "backend/entrypoint.sh",
    # Автогенерируемые Alembic-миграции: длинные строки генерирует autogenerate.
    "backend/alembic/versions",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
fixable = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# Пока нет тестов Python; правила E4/E7 для примера зарезервированы.
